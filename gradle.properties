# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.suppressUnsupportedCompileSdk=36

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# Build features — BuildConfig is enabled per-module in app/build.gradle.kts (buildFeatures.buildConfig = true)
# Do not set android.defaults.buildfeatures.buildconfig here — it emits a deprecation warning in AGP 8.5+
android.nonTransitiveRClass=true
android.nonFinalResIds=false
