name: iOS Build & Archive

on:
  push:
    branches: [ fresh-main, main ]
    paths:
      - 'ios/**'
  pull_request:
    branches: [ fresh-main, main ]
    paths:
      - 'ios/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options: [ debug, release, archive ]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Build & Test ─────────────────────────────────────────────────────
  build:
    name: Build iOS App
    runs-on: macos-14   # Apple Silicon runner — Xcode 15.x
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: python3 generate_xcodeproj.py

      - name: Install CocoaPods (if Podfile exists)
        working-directory: ios
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile — skipping CocoaPods"
          fi

      - name: Resolve Swift Package dependencies
        working-directory: ios
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Family4.xcodeproj \
            -scheme Family4 \
            -destination 'generic/platform=iOS Simulator'

      - name: Build for simulator (debug)
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project Family4.xcodeproj \
            -scheme Family4 \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Run unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project Family4.xcodeproj \
            -scheme Family4Tests \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || echo "Tests skipped (no test cases yet)"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ios/build/

  # ── Job 2: Archive & Export IPA (Release only) ──────────────────────────────
  archive:
    name: Archive & Export IPA
    runs-on: macos-14
    timeout-minutes: 60
    needs: build
    if: github.ref == 'refs/heads/fresh-main' || github.event.inputs.build_type == 'archive'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: python3 generate_xcodeproj.py

      # Import Apple Distribution certificate + provisioning profile
      # Requires these repository secrets:
      #   BUILD_CERTIFICATE_BASE64    — p12 certificate (base64)
      #   P12_PASSWORD                — p12 password
      #   BUILD_PROVISION_PROFILE_BASE64 — mobileprovision (base64)
      #   KEYCHAIN_PASSWORD           — any temp password
      - name: Import code-signing assets
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_cert.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Family4.xcodeproj \
            -scheme Family4 \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Family4.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM || 'XXXXXXXXXX' }}

      - name: Write ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>development</string>
            <key>teamID</key><string>${{ secrets.DEVELOPMENT_TEAM }}</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Family4.xcarchive \
            -exportPath $RUNNER_TEMP/Family4-IPA \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Family4-iOS-${{ github.sha }}
          path: ${{ runner.temp }}/Family4-IPA/*.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
